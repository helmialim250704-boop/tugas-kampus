<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Blockquote Example</title>
        <meta charset="utf-8">
    </head>
    <body>
        <h1>the power of nawaitu</h1>
        <P>kapan ini jagonya yaa pingin deh nyaingin yg lainya</P>
        <blockquote>
            the power of nawaitu yakni kekuatan ku dari sebuah niat.niat untuk berubah dan membuktikan bahwa semua yang kita inginkan dengan berusaha sungguh sungguh pasti bisa di Gapai
        </blockquote>
    </body>
</html>
